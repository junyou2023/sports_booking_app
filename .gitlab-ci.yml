stages:
  - lint
  - test
  - e2e

variables:
  # Allow Django to connect to the Postgres service
  DB_NAME: sportsdb
  DB_USER: sportsuser
  DB_PASS: sportspwd
  DB_HOST: postgres
  DB_PORT: "5432"
  SECRET_KEY: dummy

#######################
# 1) flake8 code style   #
#######################
lint:
  stage: lint
  image: python:3.11
  before_script:
    - python -m pip install --upgrade pip
    - pip install flake8 Pillow
  script: flake8 backend
  tags: []          # Specify runner tag here if required by school
  except:
    - tags

#######################
# 2) pytest unit tests  #
#######################
test:
  stage: test
  image: python:3.11
  services:
    - name: postgis/postgis:15-3.4
      alias: postgres
      variables:
        POSTGRES_DB: $DB_NAME
        POSTGRES_USER: $DB_USER
        POSTGRES_PASSWORD: $DB_PASS
  before_script:
    - python -m pip install --upgrade pip
    - python -m pip install -r requirements.txt
    - python backend/manage.py migrate --noinput
    - python backend/manage.py seed_facilities
  script:
    - pytest
  tags: []          # Add runner tag if needed
  artifacts:
    when: always
    expire_in: 1 week
    paths:
      - tests/        # Adjust path if storing test results/coverage HTML

e2e:
  stage: e2e
  image: cirrusci/flutter:3.19.6
  before_script:
    - flutter pub get
  script: flutter test